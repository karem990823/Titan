<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TITAN - Inscripción y Validación de Requisitos</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
    h1 { color: #38bdf8; text-align: center; font-size: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 14px; margin-bottom: 5px; }
    input, select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0369a1; }
    .alert { margin-top: 15px; padding: 12px; border-radius: 4px; display: none; font-size: 14px; }
    .alert-error { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    .alert-success { background: #14532d; color: #86efac; border: 1px solid #166534; }
    .req-box { background: #334155; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TITAN - Gestión Académica</h1>
    <h3>Validación de Inscripción (HU 15)</h3>

    <div class="form-group">
      <label>Seleccionar Curso:</label>
      <select id="curso_id" onchange="cargarRequisitos()">
        <option value="1">Curso Básico (Sin Requisito)</option>
        <option value="2">Curso Reentrenamiento (Exige Certificado)</option>
      </select>
    </div>

    <!-- CA-01: Requisitos antes de inscribir -->
    <div id="req-info" class="req-box">Cargando requisitos...</div>

    <div class="form-group">
      <label>Documento Participante:</label>
      <input type="text" id="participante_id" placeholder="Ej: 1001 (Con Cert) o 1002 (Sin Cert)">
    </div>

    <button onclick="inscribir()">Inscribir Participante</button>

    <!-- CA-02 y CA-03: Mensajes de Resultado -->
    <div id="mensaje" class="alert"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
